<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약배송 예약 및 관리 시스템</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-emerald-100 selection:text-emerald-900">

    <!-- 전체 앱 컨테이너 (모바일 앱 비율 및 데스크톱 중앙 정렬) -->
    <div class="min-h-screen flex flex-col max-w-2xl mx-auto bg-white shadow-xl border-x border-slate-200">
        
        <!-- 상단 헤더 & 모드 전환 스위치 -->
        <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3 sm:px-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div class="flex items-center gap-2.5">
                    <div id="header-icon-bg" class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-sm transition-colors duration-300">
                        <!-- 약국 십자가 SVG 아이콘 -->
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-tight">안심 약배송 시스템</h1>
                        <p id="header-subtitle" class="text-xs font-medium text-emerald-600">약국 관리자 및 고객 접수 모드</p>
                    </div>
                </div>

                <!-- 모드 선택 토글 버튼 (약국 모드 vs 배송원 모드) -->
                <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button id="btn-mode-pharmacy" onclick="switchMode('pharmacy')" class="flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg text-sm font-bold transition-all bg-white text-emerald-700 shadow-sm">
                        <span>🏥</span> 약국 모드
                    </button>
                    <button id="btn-mode-driver" onclick="switchMode('driver')" class="flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg text-sm font-bold transition-all text-slate-500 hover:text-slate-700">
                        <span>🛵</span> 배송원 모드
                    </button>
                </div>
            </div>
        </header>

        <!-- ===================================================================== -->
        <!-- 1. 약국 모드 영역 (탭: 목록 / 예약하기)                               -->
        <!-- ===================================================================== -->
        <main id="view-pharmacy" class="flex-1 flex flex-col">
            <!-- 약국 모드 서브 탭 네비게이션 -->
            <nav class="grid grid-cols-2 border-b border-slate-200 bg-slate-50/70">
                <button id="tab-pharmacy-list" onclick="switchPharmacyTab('list')" class="py-3.5 text-sm font-bold border-b-2 border-emerald-600 text-emerald-700 bg-white transition-all flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    목록 (날짜/시간순)
                    <span id="pharmacy-badge-count" class="px-2 py-0.5 text-xs rounded-full bg-emerald-100 text-emerald-800">0</span>
                </button>
                <button id="tab-pharmacy-reserve" onclick="switchPharmacyTab('reserve')" class="py-3.5 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    예약하기 (고객입력)
                </button>
            </nav>

            <!-- [약국 탭 1] 예약 목록 조회 -->
            <section id="section-pharmacy-list" class="p-4 sm:p-6 space-y-4 flex-1">
                <!-- 필터 및 요약 바 -->
                <div class="flex flex-wrap items-center justify-between gap-2 bg-emerald-50/70 border border-emerald-100 p-3.5 rounded-2xl">
                    <div class="text-xs sm:text-sm text-emerald-900 font-medium">
                        📅 <strong>예약 날짜/시간 순</strong>으로 자동 정렬됩니다.
                    </div>
                    <div class="flex items-center gap-1.5">
                        <select id="filter-status" onchange="renderPharmacyList()" class="text-xs font-semibold bg-white border border-emerald-200 text-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="ALL">전체 상태 보기</option>
                            <option value="PENDING">배송 대기중</option>
                            <option value="COMPLETED">배송 완료됨</option>
                        </select>
                    </div>
                </div>

                <!-- 예약 리스트 컨테이너 -->
                <div id="pharmacy-list-container" class="space-y-3.5">
                    <!-- JS로 카드 렌더링 -->
                </div>
            </section>

            <!-- [약국 탭 2] 예약하기 (손님 직접 입력 폼) -->
            <section id="section-pharmacy-reserve" class="hidden p-4 sm:p-6 flex-1">
                <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-5 sm:p-6 shadow-sm">
                    <div class="mb-5 pb-4 border-b border-slate-200">
                        <span class="inline-block px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-lg mb-1.5">고객 직접 입력용</span>
                        <h2 class="text-lg font-bold text-slate-900">약배송 정보 입력</h2>
                        <p class="text-xs text-slate-500 mt-1">정확한 처방약 배송을 위해 아래 항목을 빠짐없이 입력해 주세요.</p>
                    </div>

                    <form id="reservation-form" onsubmit="handleReservationSubmit(event)" class="space-y-5">
                        <!-- 예약 희망 날짜/시간 (목록 정렬 기준) -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">
                                희망 배송 날짜 및 시간 <span class="text-rose-500">*</span>
                            </label>
                            <input type="datetime-local" id="input-datetime" required
                                class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white text-slate-900 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                        </div>

                        <!-- 1. 이름 -->
                        <div>
                            <label for="input-name" class="block text-sm font-bold text-slate-700 mb-1.5">
                                1. 이름 <span class="text-rose-500">*</span>
                            </label>
                            <input type="text" id="input-name" placeholder="예: 홍길동" required
                                class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                        </div>

                        <!-- 2. 주민등록번호 7자리 -->
                        <div>
                            <label for="input-rrn" class="block text-sm font-bold text-slate-700 mb-1.5">
                                2. 주민등록번호 앞 7자리 <span class="text-rose-500">*</span>
                            </label>
                            <div class="relative">
                                <input type="text" id="input-rrn" maxlength="8" placeholder="예: 900101-1 (숫자 7자리)" required
                                    oninput="formatRRN(this)"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white text-slate-900 tracking-wider font-mono placeholder:font-sans placeholder:tracking-normal placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                                <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 font-mono">••••••</span>
                            </div>
                            <p class="text-[11px] text-slate-500 mt-1">생년월일 6자리와 성별 구분 1자리를 입력해주세요.</p>
                        </div>

                        <!-- 3. 배송지 -->
                        <div>
                            <label for="input-address" class="block text-sm font-bold text-slate-700 mb-1.5">
                                3. 배송지 주소 <span class="text-rose-500">*</span>
                            </label>
                            <textarea id="input-address" rows="2" placeholder="예: 서울시 강남구 테헤란로 123, 101동 502호 (공동현관 비밀번호: #1234)" required
                                class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition resize-none"></textarea>
                        </div>

                        <!-- 저장 버튼 -->
                        <div class="pt-2">
                            <button type="submit" class="w-full py-3.5 px-6 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold rounded-xl shadow-md shadow-emerald-600/20 transition-all flex items-center justify-center gap-2 text-base">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                예약 정보 저장하기
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <!-- ===================================================================== -->
        <!-- 2. 배송원 모드 영역 (상단 예약 정보 확인 + 하단 4)배송 탭 인증사진)   -->
        <!-- ===================================================================== -->
        <main id="view-driver" class="hidden flex-1 flex flex-col">
            <!-- 배송원 모드 상단 서브 탭 -->
            <nav class="grid grid-cols-2 border-b border-slate-200 bg-slate-50/70">
                <button id="tab-driver-active" onclick="switchDriverTab('active')" class="py-3.5 text-sm font-bold border-b-2 border-blue-600 text-blue-700 bg-white transition-all flex items-center justify-center gap-2">
                    <span>📦</span> 예약 및 배송처리
                    <span id="driver-pending-count" class="px-2 py-0.5 text-xs rounded-full bg-blue-100 text-blue-800">0</span>
                </button>
                <button id="tab-driver-done" onclick="switchDriverTab('done')" class="py-3.5 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-2">
                    <span>✅</span> 배송완료 내역
                    <span id="driver-done-count" class="px-2 py-0.5 text-xs rounded-full bg-slate-200 text-slate-700">0</span>
                </button>
            </nav>

            <!-- 배송원 메인 작업 영역 -->
            <section class="p-4 sm:p-6 space-y-5 flex-1">
                <div class="bg-blue-50 border border-blue-100 p-3.5 rounded-2xl flex items-start gap-3">
                    <span class="text-xl">🛵</span>
                    <div class="text-xs sm:text-sm text-blue-900 leading-relaxed">
                        <strong>예약 탭(고객 정보)</strong>을 확인한 뒤, 아래 <strong>4) 배송 탭</strong>에서 배송 완료 인증사진을 바로 촬영해 업로드해주세요.
                    </div>
                </div>

                <!-- 배송원용 카드 리스트 -->
                <div id="driver-list-container" class="space-y-5">
                    <!-- JS로 배송원 전용 카드 (고객 정보 + 4)배송 인증사진 업로드 영역) 렌더링 -->
                </div>
            </section>
        </main>

        <!-- 하단 푸터 -->
        <footer class="py-4 px-6 border-t border-slate-200 bg-slate-50 text-center text-xs text-slate-400">
            약국-배송원 실시간 연동 시스템 • 데이터는 브라우저에 안전하게 자동 저장됩니다.
        </footer>
    </div>

    <!-- ===================================================================== -->
    <!-- 인증사진 크게 보기 모달 (Lightbox)                                    -->
    <!-- ===================================================================== -->
    <div id="photo-modal" onclick="closePhotoModal()" class="fixed inset-0 z-50 hidden bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl animate-fade-in">
            <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                <h3 id="modal-photo-title" class="font-bold text-slate-800 text-sm">배송 완료 인증사진</h3>
                <button onclick="closePhotoModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 bg-slate-950 flex items-center justify-center">
                <img id="modal-photo-img" src="" alt="인증사진 확대" class="max-h-[70vh] w-auto rounded-lg object-contain">
            </div>
            <div id="modal-photo-desc" class="px-4 py-3 bg-slate-50 text-xs text-slate-600 font-medium"></div>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- 토스트 알림 메시지 박스 (alert() 대체)                                -->
    <!-- ===================================================================== -->
    <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <script>
        /**
         * 데이터 상태 및 로컬 스토리지 키 설정
         */
        const STORAGE_KEY = 'pharmacy_delivery_reservations_v1';
        let currentMode = 'pharmacy';      // 'pharmacy' | 'driver'
        let currentPharmacyTab = 'list';   // 'list' | 'reserve'
        let currentDriverTab = 'active';   // 'active' | 'done'
        let reservations = [];

        // 임시 촬영 사진 데이터 저장소 (ID별 base64 이미지)
        const pendingPhotos = {};

        /**
         * 초기 샘플 데이터 생성 (처음 실행 시 사용자 이해를 돕기 위한 예시)
         */
        function getInitialSampleData() {
            const now = new Date();
            const todayStr = now.toISOString().slice(0, 10);
            
            return [
                {
                    id: 'res-101',
                    datetime: `${todayStr}T14:00`,
                    name: '김민지',
                    rrn: '940512-2',
                    address: '서울시 서초구 반포대로 45, 래미안아파트 103동 1204호',
                    status: 'PENDING',
                    photoData: null,
                    completedAt: null
                },
                {
                    id: 'res-102',
                    datetime: `${todayStr}T11:30`,
                    name: '박성훈',
                    rrn: '821103-1',
                    address: '서울시 강남구 역삼로 210, 3층 오피스텔 302호 (문 앞 보관)',
                    status: 'PENDING',
                    photoData: null,
                    completedAt: null
                }
            ];
        }

        /**
         * 앱 초기화 및 데이터 로드
         */
        window.onload = function() {
            loadData();
            setDefaultDateTime();
            renderAll();
        };

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    reservations = JSON.parse(saved);
                } else {
                    reservations = getInitialSampleData();
                    saveData();
                }
            } catch (e) {
                console.error('데이터 로드 오류:', e);
                reservations = getInitialSampleData();
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(reservations));
            } catch (e) {
                showToast('저장 공간이 부족합니다. 오래된 완료 내역을 삭제해주세요.', 'error');
            }
        }

        /**
         * 예약 입력 폼의 기본 날짜/시간을 현재 시각으로 설정
         */
        function setDefaultDateTime() {
            const dtInput = document.getElementById('input-datetime');
            if (!dtInput) return;
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            dtInput.value = now.toISOString().slice(0, 16);
        }

        /**
         * 주민등록번호 7자리 자동 포맷팅 (예: 9001011 -> 900101-1)
         */
        function formatRRN(input) {
            let digits = input.value.replace(/[^0-9]/g, '').slice(0, 7);
            if (digits.length > 6) {
                input.value = digits.slice(0, 6) + '-' + digits.slice(6);
            } else {
                input.value = digits;
            }
        }

        /**
         * 모드 전환 (약국 모드 <-> 배송원 모드)
         */
        function switchMode(mode) {
            currentMode = mode;
            const viewPharmacy = document.getElementById('view-pharmacy');
            const viewDriver = document.getElementById('view-driver');
            const btnPharmacy = document.getElementById('btn-mode-pharmacy');
            const btnDriver = document.getElementById('btn-mode-driver');
            const headerIcon = document.getElementById('header-icon-bg');
            const headerSub = document.getElementById('header-subtitle');

            if (mode === 'pharmacy') {
                viewPharmacy.classList.remove('hidden');
                viewDriver.classList.add('hidden');

                btnPharmacy.className = 'flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg text-sm font-bold transition-all bg-white text-emerald-700 shadow-sm';
                btnDriver.className = 'flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg text-sm font-bold transition-all text-slate-500 hover:text-slate-700';

                headerIcon.className = 'w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-sm transition-colors duration-300';
                headerSub.textContent = '약국 관리자 및 고객 접수 모드';
                headerSub.className = 'text-xs font-medium text-emerald-600';
            } else {
                viewPharmacy.classList.add('hidden');
                viewDriver.classList.remove('hidden');

                btnDriver.className = 'flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg text-sm font-bold transition-all bg-white text-blue-700 shadow-sm';
                btnPharmacy.className = 'flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg text-sm font-bold transition-all text-slate-500 hover:text-slate-700';

                headerIcon.className = 'w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm transition-colors duration-300';
                headerSub.textContent = '배송원 전용 현장 인증 모드';
                headerSub.className = 'text-xs font-medium text-blue-600';
            }
            renderAll();
        }

        /**
         * 약국 모드 내부 탭 전환 (목록 <-> 예약하기)
         */
        function switchPharmacyTab(tab) {
            currentPharmacyTab = tab;
            const secList = document.getElementById('section-pharmacy-list');
            const secReserve = document.getElementById('section-pharmacy-reserve');
            const tabList = document.getElementById('tab-pharmacy-list');
            const tabReserve = document.getElementById('tab-pharmacy-reserve');

            if (tab === 'list') {
                secList.classList.remove('hidden');
                secReserve.classList.add('hidden');
                tabList.className = 'py-3.5 text-sm font-bold border-b-2 border-emerald-600 text-emerald-700 bg-white transition-all flex items-center justify-center gap-2';
                tabReserve.className = 'py-3.5 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-2';
                renderPharmacyList();
            } else {
                secList.classList.add('hidden');
                secReserve.classList.remove('hidden');
                tabReserve.className = 'py-3.5 text-sm font-bold border-b-2 border-emerald-600 text-emerald-700 bg-white transition-all flex items-center justify-center gap-2';
                tabList.className = 'py-3.5 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-2';
                setDefaultDateTime();
            }
        }

        /**
         * 배송원 모드 내부 탭 전환 (배송 처리중 <-> 배송 완료 내역)
         */
        function switchDriverTab(tab) {
            currentDriverTab = tab;
            const tabActive = document.getElementById('tab-driver-active');
            const tabDone = document.getElementById('tab-driver-done');

            if (tab === 'active') {
                tabActive.className = 'py-3.5 text-sm font-bold border-b-2 border-blue-600 text-blue-700 bg-white transition-all flex items-center justify-center gap-2';
                tabDone.className = 'py-3.5 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-2';
            } else {
                tabDone.className = 'py-3.5 text-sm font-bold border-b-2 border-blue-600 text-blue-700 bg-white transition-all flex items-center justify-center gap-2';
                tabActive.className = 'py-3.5 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-2';
            }
            renderDriverList();
        }

        /**
         * 손님 예약 정보 저장 처리
         */
        function handleReservationSubmit(event) {
            event.preventDefault();

            const datetimeVal = document.getElementById('input-datetime').value;
            const nameVal = document.getElementById('input-name').value.trim();
            const rrnVal = document.getElementById('input-rrn').value.trim();
            const addressVal = document.getElementById('input-address').value.trim();

            // 주민번호 7자리 숫자 검증
            const rrnDigits = rrnVal.replace(/[^0-9]/g, '');
            if (rrnDigits.length !== 7) {
                showToast('주민등록번호 앞 7자리를 정확히 입력해주세요.', 'error');
                document.getElementById('input-rrn').focus();
                return;
            }

            const newEntry = {
                id: 'res-' + Date.now(),
                datetime: datetimeVal,
                name: nameVal,
                rrn: rrnDigits.slice(0, 6) + '-' + rrnDigits.slice(6),
                address: addressVal,
                status: 'PENDING',
                photoData: null,
                completedAt: null
            };

            reservations.push(newEntry);
            saveData();

            // 폼 초기화
            document.getElementById('reservation-form').reset();
            setDefaultDateTime();

            showToast(`${nameVal}님의 약배송 예약이 등록되었습니다!`, 'success');
            
            // 저장 후 목록 탭으로 자동 이동하여 확인 가능하게 함
            switchPharmacyTab('list');
            renderAll();
        }

        /**
         * 예약 날짜/시간 오름차순 정렬 함수
         */
        function getSortedReservations() {
            return [...reservations].sort((a, b) => {
                return new Date(a.datetime).getTime() - new Date(b.datetime).getTime();
            });
        }

        /**
         * 날짜/시간 문자열 가독성 포맷팅
         */
        function formatDisplayDateTime(dtStr) {
            if (!dtStr) return '-';
            const d = new Date(dtStr);
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
            const dayName = weekDays[d.getDay()];
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${month}월 ${day}일 (${dayName}) ${hours}:${minutes}`;
        }

        /**
         * 전체 UI 렌더링 갱신
         */
        function renderAll() {
            renderPharmacyList();
            renderDriverList();
        }

        /**
         * [약국 모드] 예약 날짜/시간 순 목록 렌더링
         */
        function renderPharmacyList() {
            const container = document.getElementById('pharmacy-list-container');
            const badge = document.getElementById('pharmacy-badge-count');
            const filterVal = document.getElementById('filter-status').value;

            const sorted = getSortedReservations();
            badge.textContent = sorted.length;

            const filtered = sorted.filter(item => {
                if (filterVal === 'ALL') return true;
                return item.status === filterVal;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-14 px-4 bg-slate-50 rounded-2xl border border-dashed border-slate-300">
                        <div class="text-3xl mb-2">📋</div>
                        <p class="text-sm font-bold text-slate-600">등록된 예약 내역이 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">'예약하기' 탭에서 고객 배송 정보를 등록해보세요.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((item, idx) => {
                const isDone = item.status === 'COMPLETED';
                const statusBadge = isDone
                    ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">✅ 배송완료</span>`
                    : `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">⏳ 배송대기</span>`;

                return `
                    <div class="bg-white border ${isDone ? 'border-emerald-200 bg-emerald-50/10' : 'border-slate-200'} rounded-2xl p-4 shadow-sm hover:shadow-md transition-all">
                        <!-- 상단: 예약 일시 + 상태 뱃지 + 삭제 버튼 -->
                        <div class="flex items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-100">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-lg bg-slate-800 text-white text-xs font-bold flex items-center justify-center">${idx + 1}</span>
                                <span class="text-sm font-bold text-slate-900">🕒 ${formatDisplayDateTime(item.datetime)}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                ${statusBadge}
                                <button onclick="deleteReservation('${item.id}')" title="예약 삭제" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>

                        <!-- 고객 상세 정보 (1.이름, 2.주민번호7자리, 3.배송지) -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-sm">
                            <div class="bg-slate-50 px-3 py-2 rounded-xl">
                                <span class="text-xs text-slate-400 block">1. 고객 성함</span>
                                <span class="font-bold text-slate-800">${escapeHtml(item.name)}</span>
                            </div>
                            <div class="bg-slate-50 px-3 py-2 rounded-xl">
                                <span class="text-xs text-slate-400 block">2. 주민등록번호 (7자리)</span>
                                <span class="font-mono font-bold text-slate-800">${escapeHtml(item.rrn)}••••••</span>
                            </div>
                            <div class="sm:col-span-2 bg-slate-50 px-3 py-2.5 rounded-xl">
                                <span class="text-xs text-slate-400 block">3. 배송지 주소</span>
                                <span class="font-medium text-slate-800 break-keep">${escapeHtml(item.address)}</span>
                            </div>
                        </div>

                        <!-- 배송완료 인증사진 표시 영역 (완료된 경우) -->
                        ${isDone && item.photoData ? `
                            <div class="mt-3 pt-3 border-t border-emerald-100 flex items-center justify-between gap-3 bg-emerald-50/60 p-2.5 rounded-xl">
                                <div class="flex items-center gap-3">
                                    <img src="${item.photoData}" alt="인증사진" onclick="openPhotoModal('${item.id}')" class="w-14 h-14 rounded-lg object-cover border border-emerald-300 cursor-pointer hover:opacity-90">
                                    <div>
                                        <p class="text-xs font-bold text-emerald-900">📸 배송원 인증사진 등록됨</p>
                                        <p class="text-[11px] text-emerald-700 mt-0.5">완료시각: ${item.completedAt || ''}</p>
                                    </div>
                                </div>
                                <button onclick="openPhotoModal('${item.id}')" class="px-3 py-1.5 bg-white border border-emerald-200 text-emerald-700 text-xs font-bold rounded-lg hover:bg-emerald-50 transition">
                                    크게보기
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        /**
         * [배송원 모드] 예약 정보 확인 및 하단 4)배송 탭 인증사진 업로드 카드 렌더링
         */
        function renderDriverList() {
            const container = document.getElementById('driver-list-container');
            const pendingCountBadge = document.getElementById('driver-pending-count');
            const doneCountBadge = document.getElementById('driver-done-count');

            const sorted = getSortedReservations();
            const pendingItems = sorted.filter(i => i.status === 'PENDING');
            const doneItems = sorted.filter(i => i.status === 'COMPLETED');

            pendingCountBadge.textContent = pendingItems.length;
            doneCountBadge.textContent = doneItems.length;

            const targetList = currentDriverTab === 'active' ? pendingItems : doneItems;

            if (targetList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-14 px-4 bg-slate-50 rounded-2xl border border-dashed border-slate-300">
                        <div class="text-3xl mb-2">${currentDriverTab === 'active' ? '🎉' : '📭'}</div>
                        <p class="text-sm font-bold text-slate-600">
                            ${currentDriverTab === 'active' ? '현재 대기 중인 배송 건이 없습니다.' : '완료된 배송 내역이 아직 없습니다.'}
                        </p>
                    </div>
                `;
                return;
            }

            container.innerHTML = targetList.map((item) => {
                const previewImg = pendingPhotos[item.id];
                const isDone = item.status === 'COMPLETED';

                return `
                    <article class="bg-white border-2 ${isDone ? 'border-emerald-200' : 'border-blue-100'} rounded-2xl overflow-hidden shadow-sm">
                        <!-- 상단: 예약 탭 (손님이 입력한 정보 영역) -->
                        <div class="p-4 sm:p-5 bg-white">
                            <div class="flex items-center justify-between gap-2 mb-3">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-bold">
                                    📋 예약 정보 (고객 입력)
                                </span>
                                <span class="text-xs font-bold text-slate-500">🕒 ${formatDisplayDateTime(item.datetime)}</span>
                            </div>

                            <div class="space-y-2.5">
                                <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
                                    <div class="text-base font-bold text-slate-900">1. ${escapeHtml(item.name)}</div>
                                    <div class="text-xs font-mono bg-slate-100 px-2 py-0.5 rounded text-slate-600">2. 주민번호: ${escapeHtml(item.rrn)}••••••</div>
                                </div>
                                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/70">
                                    <div class="text-xs font-bold text-slate-500 mb-0.5">3. 배송지 주소</div>
                                    <div class="text-sm font-bold text-slate-900 leading-snug">${escapeHtml(item.address)}</div>
                                </div>
                            </div>
                        </div>

                        <!-- 하단: 4) 배송 탭 (배송완료 후 인증사진 찍어 올리기 영역) -->
                        <div class="p-4 sm:p-5 bg-slate-50 border-t border-slate-200">
                            <div class="flex items-center justify-between mb-3">
                                <span class="inline-flex items-center gap-1.5 text-sm font-bold text-slate-800">
                                    <span class="px-2 py-0.5 rounded bg-blue-600 text-white text-xs">4) 배송</span>
                                    배송완료 인증사진 업로드
                                </span>
                                ${isDone ? `<span class="text-xs font-bold text-emerald-600">완료됨 (${item.completedAt})</span>` : ''}
                            </div>

                            ${isDone ? `
                                <!-- 이미 완료된 경우 인증사진 확인 -->
                                <div class="flex items-center gap-4 bg-white p-3 rounded-xl border border-emerald-200">
                                    <img src="${item.photoData}" alt="배송완료 인증사진" onclick="openPhotoModal('${item.id}')" class="w-20 h-20 rounded-xl object-cover border border-slate-200 cursor-pointer">
                                    <div class="flex-1">
                                        <p class="text-sm font-bold text-emerald-800">인증사진 업로드 완료</p>
                                        <p class="text-xs text-slate-500 mt-1">약국 관리자 목록에 실시간 반영되었습니다.</p>
                                        <button onclick="openPhotoModal('${item.id}')" class="mt-2 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition">
                                            사진 크게 보기
                                        </button>
                                    </div>
                                </div>
                            ` : `
                                <!-- 배송 대기 중인 경우: 카메라 촬영 / 앨범 선택 & 완료 전송 -->
                                <div class="space-y-3">
                                    <input type="file" id="camera-input-${item.id}" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoCapture(event, '${item.id}')">
                                    
                                    ${previewImg ? `
                                        <div class="relative rounded-xl overflow-hidden border-2 border-blue-400 bg-slate-900">
                                            <img src="${previewImg}" alt="촬영 미리보기" class="w-full max-h-60 object-contain mx-auto">
                                            <button onclick="triggerCamera('${item.id}')" class="absolute bottom-2.5 right-2.5 px-3 py-1.5 bg-slate-900/80 text-white text-xs font-bold rounded-lg backdrop-blur-sm hover:bg-slate-900">
                                                🔄 다시 찍기
                                            </button>
                                        </div>
                                        <button onclick="completeDelivery('${item.id}')" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold rounded-xl shadow-md shadow-blue-600/20 transition flex items-center justify-center gap-2 text-sm">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                            인증사진 등록 및 배송완료 처리
                                        </button>
                                    ` : `
                                        <button onclick="triggerCamera('${item.id}')" class="w-full py-4 px-4 bg-white hover:bg-blue-50 border-2 border-dashed border-blue-300 text-blue-700 font-bold rounded-xl transition flex flex-col items-center justify-center gap-1.5">
                                            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                            </div>
                                            <span class="text-sm">📷 배송 완료 인증사진 찍기 / 올리기</span>
                                            <span class="text-[11px] font-normal text-slate-400">터치하면 카메라가 바로 실행됩니다</span>
                                        </button>
                                    `}
                                </div>
                            `}
                        </div>
                    </article>
                `;
            }).join('');
        }

        /**
         * 카메라 파일 입력창 트리거
         */
        function triggerCamera(id) {
            const input = document.getElementById(`camera-input-${id}`);
            if (input) input.click();
        }

        /**
         * 촬영된 이미지 압축 및 미리보기 저장 (localStorage 용량 최적화)
         */
        function handlePhotoCapture(event, id) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Canvas를 이용해 최대 너비 800px로 리사이징 및 JPEG 압축
                    const canvas = document.createElement('canvas');
                    const maxWidth = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // 압축된 Base64 이미지 저장
                    pendingPhotos[id] = canvas.toDataURL('image/jpeg', 0.75);
                    renderDriverList();
                    showToast('인증사진이 준비되었습니다. 아래 완료 버튼을 눌러주세요.', 'info');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        /**
         * 배송 완료 확정 및 인증사진 업로드 저장
         */
        function completeDelivery(id) {
            const photoData = pendingPhotos[id];
            if (!photoData) {
                showToast('먼저 배송 완료 인증사진을 촬영해주세요.', 'error');
                return;
            }

            const targetIndex = reservations.findIndex(item => item.id === id);
            if (targetIndex === -1) return;

            const now = new Date();
            const timeStr = `${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            reservations[targetIndex].status = 'COMPLETED';
            reservations[targetIndex].photoData = photoData;
            reservations[targetIndex].completedAt = timeStr;

            delete pendingPhotos[id];
            saveData();
            renderAll();
            showToast(`${reservations[targetIndex].name}님 약배송이 완료 처리되었습니다!`, 'success');
        }

        /**
         * 예약 건 삭제
         */
        function deleteReservation(id) {
            reservations = reservations.filter(item => item.id !== id);
            delete pendingPhotos[id];
            saveData();
            renderAll();
            showToast('해당 예약 내역이 삭제되었습니다.', 'info');
        }

        /**
         * 인증사진 확대 모달 열기/닫기
         */
        function openPhotoModal(id) {
            const item = reservations.find(r => r.id === id);
            if (!item || !item.photoData) return;

            document.getElementById('modal-photo-title').textContent = `${item.name}님 배송 완료 인증사진`;
            document.getElementById('modal-photo-img').src = item.photoData;
            document.getElementById('modal-photo-desc').textContent = `배송지: ${item.address} (완료: ${item.completedAt})`;
            document.getElementById('photo-modal').classList.remove('hidden');
        }

        function closePhotoModal() {
            document.getElementById('photo-modal').classList.add('hidden');
        }

        /**
         * XSS 방지용 HTML 이스케이프
         */
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /**
         * 커스텀 토스트 알림 표시
         */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const bgColors = {
                success: 'bg-slate-900 text-white border-emerald-500',
                error: 'bg-rose-600 text-white border-rose-400',
                info: 'bg-blue-700 text-white border-blue-400'
            };

            toast.className = `${bgColors[type] || bgColors.success} border-l-4 px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-bold flex items-center justify-between transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `<span>${message}</span>`;

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
